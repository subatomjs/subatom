<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Subatom WebSocket Tester</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --success: #22c55e;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 24px;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 900px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .full-width {
      grid-column: 1 / -1;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    h2 {
      font-size: 1.1rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .status-badge {
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 9999px;
      background-color: var(--border);
      color: var(--text-muted);
    }

    .status-badge.connected {
      background-color: rgba(34, 197, 94, 0.2);
      color: var(--success);
      border: 1px solid var(--success);
    }

    .status-badge.disconnected {
      background-color: rgba(239, 68, 68, 0.2);
      color: var(--danger);
      border: 1px solid var(--danger);
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    label {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    input {
      background-color: #0f172a;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 6px;
      outline: none;
      font-size: 0.9rem;
    }

    input:focus {
      border-color: var(--primary);
    }

    .btn-row {
      display: flex;
      gap: 8px;
    }

    button {
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: 6px;
      padding: 8px 16px;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.15s ease;
    }

    button:hover {
      background-color: var(--primary-hover);
    }

    button.btn-danger {
      background-color: var(--danger);
    }

    button.btn-danger:hover {
      background-color: #dc2626;
    }

    .logs-box {
      background-color: #0b1120;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px;
      height: 240px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 0.82rem;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .log-item {
      padding: 4px 6px;
      border-radius: 4px;
      word-break: break-all;
    }

    .log-item.system {
      color: var(--text-muted);
    }

    .log-item.sent {
      color: #60a5fa;
      background: rgba(96, 165, 250, 0.08);
    }

    .log-item.received {
      color: #4ade80;
      background: rgba(74, 222, 128, 0.08);
    }

    .log-item.error {
      color: #f87171;
      background: rgba(248, 113, 113, 0.08);
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Chat Client Panel -->
    <div class="card">
      <h2>
        Chat Room Endpoint
        <span id="chatStatus" class="status-badge disconnected">Disconnected</span>
      </h2>

      <div class="form-group">
        <label for="roomId">Room ID</label>
        <input type="text" id="roomId" value="room-101" />
      </div>

      <div class="form-group">
        <label for="token">Auth Token</label>
        <input type="text" id="token" value="secret-token" />
      </div>

      <div class="btn-row">
        <button id="connectChatBtn">Connect</button>
        <button id="disconnectChatBtn" class="btn-danger">Disconnect</button>
      </div>

      <div class="form-group">
        <label for="chatMsg">Message Payload</label>
        <input type="text" id="chatMsg" placeholder="Type a chat message..." />
      </div>

      <button id="sendChatBtn">Broadcast Message</button>

      <div id="chatLogs" class="logs-box"></div>
    </div>

    <!-- Live Notifications Panel -->
    <div class="card">
      <h2>
        Live Notifications
        <span id="notifyStatus" class="status-badge disconnected">Disconnected</span>
      </h2>

      <div class="btn-row">
        <button id="connectNotifyBtn">Connect</button>
        <button id="disconnectNotifyBtn" class="btn-danger">Disconnect</button>
      </div>

      <div class="form-group">
        <label for="notifyMsg">Raw Message</label>
        <input type="text" id="notifyMsg" placeholder="Type raw text to send..." />
      </div>

      <button id="sendNotifyBtn">Send Raw Text</button>

      <div id="notifyLogs" class="logs-box"></div>
    </div>
  </div>

  <script>
    const origin = window.location.host;
    const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";

    // --- Chat WebSocket Logic ---
    let chatWs = null;
    const chatStatus = document.getElementById("chatStatus");
    const chatLogs = document.getElementById("chatLogs");
    const roomIdInput = document.getElementById("roomId");
    const tokenInput = document.getElementById("token");
    const chatMsgInput = document.getElementById("chatMsg");

    function appendLog(box, text, type = "system") {
      const el = document.createElement("div");
      el.className = `log-item ${type}`;
      el.textContent = `[${new Date().toLocaleTimeString()}] ${text}`;
      box.appendChild(el);
      box.scrollTop = box.scrollHeight;
    }

    document.getElementById("connectChatBtn").addEventListener("click", () => {
      if (chatWs) chatWs.close();

      const roomId = encodeURIComponent(roomIdInput.value.trim());
      const token = encodeURIComponent(tokenInput.value.trim());
      const url = `${protocol}//${origin}/chat/${roomId}?token=${token}`;
      console.log("url", url)

      appendLog(chatLogs, `Connecting to: ${url}`);
      chatWs = new WebSocket(url);

      chatWs.onopen = () => {
        chatStatus.textContent = "Connected";
        chatStatus.className = "status-badge connected";
        appendLog(chatLogs, "Handshake successful (Connected)");
      };

      chatWs.onmessage = (e) => {
        appendLog(chatLogs, `Received: ${e.data}`, "received");
      };

      chatWs.onclose = (e) => {
        chatStatus.textContent = "Disconnected";
        chatStatus.className = "status-badge disconnected";
        appendLog(chatLogs, `Closed: Code ${e.code}, Reason: "${e.reason || 'None'}"`, "error");
      };

      chatWs.onerror = () => {
        appendLog(chatLogs, "WebSocket encounter an error.", "error");
      };
    });

    document.getElementById("disconnectChatBtn").addEventListener("click", () => {
      if (chatWs) chatWs.close();
    });

    document.getElementById("sendChatBtn").addEventListener("click", () => {
      if (!chatWs || chatWs.readyState !== WebSocket.OPEN) {
        appendLog(chatLogs, "Cannot send: Not connected", "error");
        return;
      }
      const text = chatMsgInput.value.trim();
      if (!text) return;

      const payload = JSON.stringify({ type: "CHAT_MESSAGE", text });
      chatWs.send(payload);
      appendLog(chatLogs, `Sent: ${payload}`, "sent");
      chatMsgInput.value = "";
    });

    // --- Live Notifications WebSocket Logic ---
    let notifyWs = null;
    const notifyStatus = document.getElementById("notifyStatus");
    const notifyLogs = document.getElementById("notifyLogs");
    const notifyMsgInput = document.getElementById("notifyMsg");

    document.getElementById("connectNotifyBtn").addEventListener("click", () => {
      if (notifyWs) notifyWs.close();

      const url = `${protocol}//${origin}/live/notifications`;
      appendLog(notifyLogs, `Connecting to: ${url}`);
      notifyWs = new WebSocket(url);

      notifyWs.onopen = () => {
        notifyStatus.textContent = "Connected";
        notifyStatus.className = "status-badge connected";
        appendLog(notifyLogs, "Connected to /live/notifications");
      };

      notifyWs.onmessage = (e) => {
        appendLog(notifyLogs, `Received: ${e.data}`, "received");
      };

      notifyWs.onclose = (e) => {
        notifyStatus.textContent = "Disconnected";
        notifyStatus.className = "status-badge disconnected";
        appendLog(notifyLogs, `Closed: Code ${e.code}`, "error");
      };

      notifyWs.onerror = () => {
        appendLog(notifyLogs, "WebSocket encounter an error.", "error");
      };
    });

    document.getElementById("disconnectNotifyBtn").addEventListener("click", () => {
      if (notifyWs) notifyWs.close();
    });

    document.getElementById("sendNotifyBtn").addEventListener("click", () => {
      if (!notifyWs || notifyWs.readyState !== WebSocket.OPEN) {
        appendLog(notifyLogs, "Cannot send: Not connected", "error");
        return;
      }
      const rawText = notifyMsgInput.value.trim();
      if (!rawText) return;

      notifyWs.send(rawText);
      appendLog(notifyLogs, `Sent: ${rawText}`, "sent");
      notifyMsgInput.value = "";
    });
  </script>
</body>
</html>
